[project]
name = "mcapp"
version = "1.6.14"
requires-python = ">=3.11"
dependencies = [
    "timezonefinder>=6.5.0",
    "httpx>=0.27",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.47.0",
    "pydantic>=2.0",
    "sse-starlette>=3.4.4",
]

[project.scripts]
mcapp = "mcapp.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.workspace]
members = ["ble_service"]

# NOTE: Keep all [tool.ruff*] sections identical across MCProxy, ble_service and
# mc-chat — src/mcapp/classifier is a git subtree shared with mc-chat and must
# lint clean under the same rules in both repos.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "A",      # builtins shadowing
    "ARG",    # unused arguments
    "ASYNC",  # async pitfalls
    "B",      # bugbear
    "C4",     # comprehensions
    "DTZ",    # naive datetime
    "E",      # pycodestyle errors
    "ERA",    # commented-out code
    "F",      # pyflakes
    "FURB",   # modernization
    "G",      # logging format
    "I",      # import sorting
    "ISC",    # implicit str concat
    "LOG",    # logging misuse
    "N",      # naming
    "PERF",   # performance
    "PGH",    # blanket noqa/type-ignore
    "PIE",    # misc
    "PL",     # pylint
    "PT",     # pytest style
    "PTH",    # pathlib
    "RET",    # return style
    "RSE",    # raise style
    "RUF",    # ruff-specific
    "S",      # security (bandit)
    "SIM",    # simplification
    "SLF",    # private member access
    "T10",    # debugger leftovers
    "TRY",    # exception handling
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
    "YTT",    # sys.version misuse
]
ignore = [
    "ISC001",   # conflicts with ruff format
    "TRY003",   # exception messages inline at the raise site are fine
    "PLW0603",  # module-level state via `global` is an established pattern here
    "RUF001",   # German typography + emojis in user-facing strings
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Header",
    "fastapi.Body", "fastapi.Path", "fastapi.Cookie",
]

[tool.ruff.lint.per-file-ignores]
# Test code: asserts, magic values, private access, fixture args are fine
"**/tests/**" = ["S101", "PLR2004", "SLF001", "ARG", "S105", "S106", "PLC0415"]
"**/test_*.py" = ["S101", "PLR2004", "SLF001", "ARG", "S105", "S106", "PLC0415"]
"**/tests.py" = ["S101", "PLR2004", "SLF001", "ARG", "PLC0415"]

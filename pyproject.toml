[project]
name = "mcapp"
version = "2.0.5"
requires-python = ">=3.11"
dependencies = [
    "timezonefinder>=6.5.0",
    "httpx>=0.27",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.52.4",
    "pydantic>=2.0",
    "sse-starlette>=3.4.4",
    "pywebpush>=2.3.0",
]

[project.scripts]
mcapp = "mcapp.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.workspace]
members = ["ble_service"]

# NOTE: Keep all [tool.ruff*] sections identical across MCProxy, ble_service and
# mc-chat — src/mcapp/classifier is a git subtree shared with mc-chat and must
# lint clean under the same rules in both repos.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "A",      # builtins shadowing
    "ARG",    # unused arguments
    "ASYNC",  # async pitfalls
    "B",      # bugbear
    "C4",     # comprehensions
    "DTZ",    # naive datetime
    "E",      # pycodestyle errors
    "ERA",    # commented-out code
    "F",      # pyflakes
    "FURB",   # modernization
    "G",      # logging format
    "I",      # import sorting
    "ISC",    # implicit str concat
    "LOG",    # logging misuse
    "N",      # naming
    "PERF",   # performance
    "PGH",    # blanket noqa/type-ignore
    "PIE",    # misc
    "PL",     # pylint
    "PT",     # pytest style
    "PTH",    # pathlib
    "RET",    # return style
    "RSE",    # raise style
    "RUF",    # ruff-specific
    "S",      # security (bandit)
    "SIM",    # simplification
    "SLF",    # private member access
    "T10",    # debugger leftovers
    "TRY",    # exception handling
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
    "YTT",    # sys.version misuse
]
ignore = [
    "ISC001",   # conflicts with ruff format
    "TRY003",   # exception messages inline at the raise site are fine
    "PLW0603",  # module-level state via `global` is an established pattern here
    "RUF001",   # German typography + emojis in user-facing strings
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Header",
    "fastapi.Body", "fastapi.Path", "fastapi.Cookie",
]

[tool.ruff.lint.per-file-ignores]
# Test code: asserts, magic values, private access, fixture args are fine
"**/tests/**" = ["S101", "PLR2004", "SLF001", "ARG", "S105", "S106", "PLC0415"]
"**/test_*.py" = ["S101", "PLR2004", "SLF001", "ARG", "S105", "S106", "PLC0415"]
# `*_tests.py` is MCProxy's dominant test naming (push_tests.py, router_tests.py,
# udp_parsing_tests.py, ...): in-package suites run by scripts/run_startup_tests.py.
# It matched NONE of the patterns above, so those files carried hand-written
# `# noqa: S101` markers to say what this line now says once.
"**/*_tests.py" = ["S101", "PLR2004", "SLF001", "ARG", "S105", "S106", "PLC0415"]
"**/tests.py" = ["S101", "PLR2004", "SLF001", "ARG", "PLC0415"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
]

# --- Static type checking -------------------------------------------------
# Run through the project env, NOT an ephemeral runner:
#   uv run mypy src/mcapp
# (uvx/pipx mypy parses under whatever Python they pull, emitting bogus
# [syntax] errors on version-gated stubs — always use `uv run`.)
[tool.mypy]
python_version = "3.11"
strict = true

# Untyped third-party libs with no upstream stubs / py.typed marker.
# Silence import errors only — we type our own code, not theirs.
[[tool.mypy.overrides]]
module = [
    "pywebpush.*",
    "py_vapid.*",
    "timezonefinder.*",
]
ignore_missing_imports = true

# numpy (transitive via timezonefinder) ships py.typed stubs that use 3.12+
# `type` syntax; under python_version 3.11 mypy would mis-parse them. Skip
# following into it — we never annotate against numpy directly.
[[tool.mypy.overrides]]
module = ["numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

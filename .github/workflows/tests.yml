name: tests

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + startup test suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Pin Python 3.11
        run: uv python install 3.11

      - name: Ruff lint
        run: uvx ruff check .

      - name: Ruff format check
        run: uvx ruff format --check .

      # scripts/run_startup_tests.py is the canonical, exit-code-gated runner.
      # It is fully offline (weather is stubbed) and needs no /etc/mcapp config.
      - name: Startup test suites
        run: uv run python scripts/run_startup_tests.py
